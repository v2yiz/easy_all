<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Workspace Sign In</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f6fa;
    color: #1f2933;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  main {
    width: 100%;
    max-width: 380px;
    margin: 24px;
    padding: 32px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 6px 24px rgba(15, 23, 42, .12);
  }
  h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
  p.subtitle { margin: 0 0 24px; font-size: 14px; color: #616e7c; }
  label { display: block; margin: 0 0 6px; font-size: 13px; font-weight: 500; }
  input {
    width: 100%;
    box-sizing: border-box;
    margin: 0 0 16px;
    padding: 10px 12px;
    font-size: 14px;
    border: 1px solid #cbd2d9;
    border-radius: 6px;
    background: #fff;
    color: inherit;
  }
  button {
    width: 100%;
    padding: 11px 12px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: #2563eb;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  footer { margin: 20px 0 0; font-size: 12px; color: #9aa5b1; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>Workspace Sign In</h1>
  <p class="subtitle">Sign in to continue to your team workspace.</p>
  <form method="post" action="/api/auth/login">
    <label for="email">Work email</label>
    <input id="email" name="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
  <footer>Contact your workspace administrator if you cannot sign in.</footer>
</main>
</body>
</html>
