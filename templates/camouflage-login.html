<!DOCTYPE html>

<body class="page-auth">
<main class="auth-wrap">
  <section class="card auth-card" aria-labelledby="auth-heading">
    <header class="auth-header">
      <div class="brand-row">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">__BRAND__</span>
        <span class="domain-pill">__DOMAIN__</span>
      </div>
      <h1 id="auth-heading">__TITLE__</h1>

    </header>

      <div class="field">
        <label for="email">Work email</label>
        <input id="email" name="email" type="email" autocomplete="username" placeholder="name@__DOMAIN__" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <div id="auth-status" class="alert alert-error" role="alert" aria-live="polite" hidden></div>
      <button id="auth-submit" class="btn-primary" type="submit">Sign in</button>
    </form>
    <p class="auth-hint">__TAGLINE__</p>
  </section>
  <footer class="auth-footer">
    <p>__FOOTER_NOTE__</p>
    <p>Support: <a href="mailto:__CONTACT_EMAIL__">__CONTACT_EMAIL__</a> · &copy; __YEAR__ __BRAND__ · build __BUILD_ID__</p>
