# 代理节点（AnyTLS 直连 / VLESS CDN / 聚合节点）由订阅按模式注入，模板本身不放置占位凭据。
proxies:
# EASY_ALL_PROXY_NODE

proxy-groups:
    - name: PROXY
      type: select
      proxies:
# EASY_ALL_PROXY_NAME
    - name: GLOBAL
      hidden: true
      type: select
      proxies:
        - PROXY
# EASY_ALL_PROXY_GROUP

rules:
  # 项目服务与 Steam 下载直连；社区由 proxy-services 单独代理。
  - RULE-SET,direct-cdn,DIRECT
  # 局域网直连。
  - RULE-SET,geosite-private,DIRECT
  # 零地址拒绝优先于 LAN；DNS 黑洞结果不得进入直连或代理出口。
  - IP-CIDR,0.0.0.0/8,REJECT,no-resolve
  - GEOIP,LAN,DIRECT,no-resolve
  # 单标签主机名不是公网域名；认证门户检测必须在本地直连。
  - DOMAIN-REGEX,^[^.]+$,DIRECT
  - RULE-SET,captive-portal,DIRECT
  # FCM 使用真实 IP 后可能没有域名信息；专用 TCP 推送端口仍经代理，优先于 CN IP 直连。
  - AND,((NETWORK,TCP),(DST-PORT,5228-5230)),PROXY
  # Google 优先于国内集合，让 Play 接口与下载使用同一代理出口。
  # 先拒绝 Google QUIC，保留 TCP 回退；VPS 出站地址族仍由服务端策略锁定。
  - AND,((NETWORK,UDP),(DST-PORT,443),(RULE-SET,geosite-google)),REJECT
  - RULE-SET,geosite-google,PROXY
  # 明确代理的 AI 及服务例外优先于 CN/微软直连，且不能绕过 QUIC 拒绝。
  - AND,((NETWORK,UDP),(DST-PORT,443),(RULE-SET,geosite-github)),REJECT
  - RULE-SET,geosite-github,PROXY
  - AND,((NETWORK,UDP),(DST-PORT,443),(RULE-SET,geosite-openai)),REJECT
  - RULE-SET,geosite-openai,PROXY
  - AND,((NETWORK,UDP),(DST-PORT,443),(RULE-SET,geosite-anthropic)),REJECT
  - RULE-SET,geosite-anthropic,PROXY
  - AND,((NETWORK,UDP),(DST-PORT,443),(RULE-SET,proxy-services)),REJECT
  - RULE-SET,proxy-services,PROXY
  # 国内 CDN 与上方国内 DNS 策略对齐，保留直连下载及 QUIC。
  - RULE-SET,geosite-apple-cn,DIRECT
  - RULE-SET,geosite-microsoft-cn,DIRECT
  # 完整国内域名集合；Google、AI 与 .ms 例外已在上方优先处理。
  # 国内 QUIC 例外只匹配已有目标 IP；未知域名不会仅为 GEOIP 判断额外解析。
  - RULE-SET,geosite-cn,DIRECT
  - RULE-SET,geosite-geolocation-cn,DIRECT
  - AND,((NETWORK,UDP),(DST-PORT,443),(RULE-SET,geoip-cn,no-resolve)),DIRECT
  # 其余 UDP/443 拒绝，避免 QUIC 经 Reality/XHTTP/WebSocket 的 TCP 型隧道传输。
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT
  - DOMAIN,clash.razord.top,DIRECT
  - DOMAIN,yacd.haishan.me,DIRECT
  # 其余 AI 分类保留在 CN 后，避免把 Kimi 等重叠服务无条件改成代理。
  - RULE-SET,geosite-ai-chat,PROXY
  # Telegram 专属 IP 段代理
  - RULE-SET,geoip-telegram,PROXY,no-resolve
  # CN GeoIP 兜底只匹配已有目标 IP；未知域名不会仅为 GEOIP 判断额外解析，
  # 未命中域名集合时交给 MATCH,PROXY。需要覆盖未收录国内域名时应扩充域名集合。
  - RULE-SET,geoip-cn,DIRECT,no-resolve
  # 最终兜底：其余国外网站/视频/服务全部走代理
  - MATCH,PROXY
