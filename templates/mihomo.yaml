    # 节点引导独立直连，避免海外 DoH 与代理节点解析互相依赖。
    proxy-server-nameserver: ['https://223.5.5.5/dns-query', 'https://1.12.12.12/dns-query']
    nameserver: ['https://1.1.1.1/dns-query#PROXY', 'https://8.8.8.8/dns-query#PROXY']
    nameserver-policy:
      'rule-set:private-fallback,geosite-private': system
      'rule-set:captive-portal': system
      'testingcf.jsdelivr.net': ['https://223.5.5.5/dns-query', 'https://1.12.12.12/dns-query']
      # 代理域名优先于国内集合（例如 services.googleapis.cn）。
      'rule-set:proxy-services,geosite-google': ['https://1.1.1.1/dns-query#PROXY', 'https://8.8.8.8/dns-query#PROXY']
      # 微信资源与 Steam 下载优先于完整版的通用境外域名集合。
      'rule-set:wechat-services,steam-download': ['https://223.5.5.5/dns-query', 'https://1.12.12.12/dns-query']
      'rule-set:apple-cn-fallback,geosite-apple-cn': ['https://223.5.5.5/dns-query', 'https://1.12.12.12/dns-query']
      'rule-set:direct-services,geosite-cn,geosite-geolocation-cn': ['https://223.5.5.5/dns-query', 'https://1.12.12.12/dns-query']

# 直连 Mieru 节点由订阅/Worker 以 type: mieru 注入，模板本身不放置占位凭据。
proxies:
# EASY_ALL_PROXY_NODE

proxy-groups:
    - name: PROXY
      type: select
      proxies:
# EASY_ALL_PROXY_NAME
    - name: GLOBAL
      hidden: true
      type: select
      proxies:
        - PROXY
# EASY_ALL_PROXY_GROUP

rule-providers:
    # 基础集合始终可用；远程 MRS 仅扩充覆盖，避免单镜像失败使全部规则失效。
