<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">为 Worker 添加 Custom Domain</title>
  <desc id="desc">在目标 Worker 的 Domains and Routes 中添加 sub.example.com，Cloudflare 自动创建只读的 Proxied DNS、接入 CDN 并签发证书。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f48120"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#1f2937}.small{font-size:21px}.body{font-size:25px}.label{font-size:24px;font-weight:680}.title{font-size:42px;font-weight:760}.muted{fill:#6b7280}.orange{fill:#f48120}.green{fill:#0f9d72}.blue{fill:#2563eb}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    </style>
  </defs>
  <rect width="1400" height="900" fill="#f5f7fb"/>
  <text x="70" y="72" class="title">推荐：添加 Worker Custom Domain</text>
  <text x="70" y="114" class="body muted">Workers &amp; Pages → your-worker → Settings → Domains &amp; Routes → Add → Custom Domain</text>
  <rect x="70" y="152" width="1260" height="650" rx="24" fill="#fff" filter="url(#shadow)"/>
  <rect x="70" y="152" width="1260" height="64" rx="24" fill="#1f2937"/>
  <text x="110" y="194" class="small" style="fill:#fff">your-worker  ›  Settings  ›  Domains &amp; Routes  ›  Add Custom Domain</text>

  <text x="110" y="285" class="label">Domain</text>
  <rect x="330" y="245" width="720" height="64" rx="10" fill="#fff" stroke="#f48120" stroke-width="3"/>
  <text x="365" y="287" class="body mono">sub.example.com</text>
  <text x="1080" y="284" class="small green">✓ 独立订阅域名</text>

  <rect x="110" y="350" width="1170" height="108" rx="14" fill="#eefaf6"/>
  <text x="145" y="390" class="label green">Cloudflare 自动完成 CDN 接入</text>
  <text x="145" y="428" class="small">创建只读的 Proxied / 橙云 DNS 并签发证书；无需手工添加 DNS、源站或 Route。</text>

  <rect x="110" y="510" width="340" height="115" rx="18" fill="#eef3ff" stroke="#cfd9ef" stroke-width="2"/>
  <text x="145" y="551" class="small muted">订阅客户端</text>
  <text x="145" y="590" class="body mono">sub.example.com</text>
  <line x1="470" y1="568" x2="620" y2="568" stroke="#f48120" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="645" y="510" width="260" height="115" rx="18" fill="#fff8f1" stroke="#f48120" stroke-width="3"/>
  <text x="705" y="551" class="small orange">Worker</text>
  <text x="680" y="590" class="body mono">your-worker</text>
  <line x1="925" y1="568" x2="1070" y2="568" stroke="#f48120" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="1095" y="510" width="185" height="115" rx="18" fill="#eefaf6" stroke="#9ddbc7" stroke-width="2"/>
  <text x="1146" y="551" class="small green">响应</text>
  <text x="1130" y="590" class="body mono">订阅内容</text>

  <rect x="110" y="677" width="1170" height="85" rx="14" fill="#fff8f1"/>
  <text x="145" y="713" class="label orange">不要使用节点域名 rn.example.com</text>
  <text x="145" y="746" class="small">Custom Domain 会接管该主机名的全部路径；请为订阅单独使用 sub.example.com。</text>
  <text x="70" y="857" class="small muted">添加完成后，把 workers.dev 替换为 sub.example.com；/subscribe、token 和 flag 参数保持不变。</text>
</svg>
