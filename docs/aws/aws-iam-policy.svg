<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Least privilege IAM policy for easy_all</title>
  <desc id="desc">The deployer can manage the required Route 53, ACM, CloudFront, WAF, account-plan, and free pricing-plan resources, but cannot delete resources or approve paid CloudFront subscriptions.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-opacity=".12"/></filter><style>.ttl{font:700 31px system-ui,sans-serif;fill:#172b4d}.sub{font:16px system-ui,sans-serif;fill:#5e6c84}.h{font:700 20px system-ui,sans-serif;fill:#172b4d}.t{font:15px system-ui,sans-serif;fill:#344563}.mono{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#172b4d}.box{filter:url(#s);stroke-width:2}</style></defs>
  <rect width="1200" height="680" fill="#f7f9fc"/>
  <text x="58" y="62" class="ttl">easy_all_deployer · 最小权限拆分</text>
  <text x="58" y="93" class="sub">创建/读取/更新，不授予删除权限</text>

  <rect class="box" x="65" y="155" width="250" height="310" rx="18" fill="#fff" stroke="#4c9aff"/>
  <rect x="65" y="155" width="250" height="62" rx="18" fill="#deebff"/><text x="190" y="194" class="h" text-anchor="middle">Route 53</text>
  <text x="90" y="252" class="t">✓ ListHostedZones</text><text x="90" y="283" class="t">✓ ListResourceRecordSets</text><text x="90" y="314" class="t">✓ ChangeResourceRecordSets</text><text x="90" y="345" class="sub">DNS 写入限定到 Zone ARN</text>
  <rect x="88" y="378" width="204" height="55" rx="10" fill="#f4f5f7"/><text x="190" y="401" class="mono" text-anchor="middle">1 个或多个 Zone</text><text x="190" y="422" class="sub" text-anchor="middle">每个 Zone 一条 ARN</text>

  <rect class="box" x="365" y="155" width="210" height="310" rx="18" fill="#fff" stroke="#6554c0"/>
  <rect x="365" y="155" width="210" height="62" rx="18" fill="#eae6ff"/><text x="470" y="194" class="h" text-anchor="middle">ACM</text>
  <text x="390" y="252" class="t">✓ ListCertificates</text><text x="390" y="283" class="t">✓ RequestCertificate</text><text x="390" y="314" class="t">✓ DescribeCertificate</text>
  <text x="470" y="385" class="sub" text-anchor="middle">CloudFront 证书固定</text><text x="470" y="409" class="mono" text-anchor="middle">us-east-1</text>

  <rect class="box" x="625" y="155" width="285" height="310" rx="18" fill="#fff" stroke="#ff9900"/>
  <rect x="625" y="155" width="285" height="62" rx="18" fill="#fff0d5"/><text x="768" y="194" class="h" text-anchor="middle">CloudFront 与套餐</text>
  <text x="650" y="252" class="t">✓ 分配：读取/创建/更新</text><text x="650" y="283" class="t">✓ Free WAF：读取/创建</text><text x="650" y="314" class="t">✓ Account plan：查询/升级</text><text x="650" y="345" class="t">✓ Pricing plan：仅 FREE</text>
  <text x="768" y="402" class="sub" text-anchor="middle">按量模式不创建 WAF</text><text x="768" y="429" class="sub" text-anchor="middle">固定套餐只允许 FREE</text>

  <rect class="box" x="960" y="155" width="175" height="310" rx="18" fill="#ffebe6" stroke="#de350b"/>
  <rect x="960" y="155" width="175" height="62" rx="18" fill="#ffbdad"/><text x="1048" y="194" class="h" text-anchor="middle">明确没有</text>
  <text x="985" y="260" class="t">✕ 删除资源</text><text x="985" y="299" class="t">✕ 批准付费套餐</text><text x="985" y="338" class="t">✕ IAM 管理权限</text><text x="985" y="377" class="t">✕ Cloudflare 权限</text>

  <rect x="150" y="530" width="900" height="92" rx="16" fill="#fff" stroke="#dfe1e6" stroke-width="2"/>
  <text x="600" y="568" class="h" text-anchor="middle">STS GetCallerIdentity</text>
  <text x="600" y="597" class="sub" text-anchor="middle">只用于验证当前凭证身份，不返回 Secret Access Key</text>
</svg>
