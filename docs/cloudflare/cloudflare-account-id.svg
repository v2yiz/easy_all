<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Cloudflare Account ID 获取示意图</title>
  <desc id="desc">通过 Cloudflare Dashboard 的 Copy account ID 命令获取 Account ID。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f48120"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#1f2937}
      .small{font-size:22px}.body{font-size:26px}.label{font-size:24px;font-weight:650}.title{font-size:42px;font-weight:760}.muted{fill:#6b7280}.orange{fill:#f48120}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    </style>
  </defs>
  <rect width="1400" height="820" fill="#f5f7fb"/>
  <text x="70" y="78" class="title">1. 找到 Cloudflare Account ID</text>
  <text x="70" y="118" class="body muted">Dashboard → Command/Ctrl + K → Copy account ID</text>
  <rect x="70" y="160" width="1260" height="570" rx="24" fill="#fff" filter="url(#shadow)"/>
  <rect x="70" y="160" width="1260" height="68" rx="24" fill="#e9edf3"/>
  <circle cx="110" cy="194" r="9" fill="#ff5f57"/><circle cx="140" cy="194" r="9" fill="#febc2e"/><circle cx="170" cy="194" r="9" fill="#28c840"/>
  <rect x="220" y="176" width="1050" height="38" rx="10" fill="#fff"/>
  <text x="245" y="203" class="small muted mono">https://dash.cloudflare.com/</text>
  <rect x="590" y="180" width="440" height="31" rx="7" fill="#fff1e7" stroke="#f48120" stroke-width="3"/>
  <text x="603" y="203" class="small orange mono">0123456789abcdef0123456789abcdef</text>
  <text x="1037" y="203" class="small muted mono">/home</text>
  <rect x="70" y="228" width="290" height="502" fill="#fbfcfe"/>
  <text x="110" y="284" class="label">Cloudflare</text>
  <rect x="92" y="322" width="246" height="54" rx="12" fill="#fff1e7"/>
  <text x="118" y="356" class="body orange">Account home</text>
  <text x="110" y="426" class="small muted">Domains</text>
  <text x="110" y="472" class="small muted">Compute</text>
  <text x="110" y="518" class="small muted">Manage account</text>
  <text x="410" y="302" class="label">Account home</text>
  <text x="410" y="350" class="body muted">账户主页加载后，查看浏览器地址栏。</text>
  <rect x="410" y="402" width="815" height="130" rx="18" fill="#fff8f1" stroke="#f48120" stroke-width="3"/>
  <text x="445" y="448" class="label orange">Account ID</text>
  <text x="445" y="493" class="body mono">0123456789abcdef0123456789abcdef</text>
  <path d="M805 402C805 345 805 300 805 228" fill="none" stroke="#f48120" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="410" y="594" class="body">推荐使用 Dashboard 的 Copy account ID 命令</text>
  <text x="410" y="636" class="body muted">地址栏仅用于辅助辨认；不要把 Zone ID 当作 Account ID。</text>
  <rect x="70" y="760" width="1260" height="1" fill="#dbe1ea"/>
  <text x="70" y="798" class="small muted">示例值均为虚构内容，不包含真实账户信息。</text>
</svg>
