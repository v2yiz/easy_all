<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Cloudflare DNS Token 配置示意图</title>
  <desc id="desc">为手工 DNS 管理创建限制到单个 Zone 的独立 Token。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity=".12"/></filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#1f2937}.small{font-size:21px}.body{font-size:25px}.label{font-size:24px;font-weight:680}.title{font-size:42px;font-weight:760}.muted{fill:#6b7280}.orange{fill:#f48120}.green{fill:#0f9d72}.blue{fill:#1677aa}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    </style>
  </defs>
  <rect width="1400" height="900" fill="#f5f7fb"/>
  <text x="70" y="72" class="title">3. 可选：创建独立 DNS API Token</text>
  <text x="70" y="114" class="body muted">仅用于手工 DNS / Route；推荐的 Custom Domain 部署不需要</text>
  <rect x="70" y="152" width="1260" height="650" rx="24" fill="#fff" filter="url(#shadow)"/>
  <rect x="70" y="152" width="1260" height="64" rx="24" fill="#1f2937"/>
  <text x="110" y="194" class="small" style="fill:#fff">My Profile  ›  API Tokens  ›  Create Custom Token</text>
  <text x="110" y="270" class="label">Token name</text>
  <rect x="320" y="235" width="520" height="52" rx="10" fill="#fff" stroke="#cfd6df" stroke-width="2"/>
  <text x="344" y="269" class="body mono">easy-all-dns</text>
  <text x="110" y="340" class="label">Permissions</text>
  <rect x="110" y="370" width="1170" height="190" rx="15" fill="#fafbfc" stroke="#dbe1ea" stroke-width="2"/>
  <text x="145" y="413" class="small muted">Resource</text><text x="430" y="413" class="small muted">Permission</text><text x="915" y="413" class="small muted">Level</text>
  <line x1="130" y1="430" x2="1260" y2="430" stroke="#dbe1ea"/>
  <text x="145" y="472" class="body">Zone</text><text x="430" y="472" class="body">DNS</text><rect x="900" y="442" width="126" height="45" rx="9" fill="#fff1e7"/><text x="931" y="472" class="body orange">Edit</text><text x="1065" y="472" class="small green">管理 DNS</text>
  <text x="145" y="529" class="body">Zone</text><text x="430" y="529" class="body">Zone</text><rect x="900" y="499" width="126" height="45" rx="9" fill="#edf7ff"/><text x="929" y="529" class="body blue">Read</text><text x="1065" y="529" class="small green">查询 Zone ID</text>
  <text x="110" y="630" class="label">Zone Resources</text>
  <rect x="340" y="595" width="235" height="52" rx="10" fill="#fff" stroke="#cfd6df" stroke-width="2"/><text x="370" y="629" class="body">Include</text>
  <rect x="595" y="595" width="500" height="52" rx="10" fill="#fff" stroke="#f48120" stroke-width="3"/><text x="625" y="629" class="body">Specific zone: example.com</text>
  <rect x="110" y="690" width="1170" height="76" rx="14" fill="#fff8f1"/>
  <text x="145" y="722" class="label orange">不要传给纯 Worker 部署脚本</text>
  <text x="145" y="751" class="small">Custom Domain 会自动管理 DNS；Worker Token 与 DNS Token 应保持分离。</text>
  <text x="70" y="858" class="small muted">只有手工维护 DNS 或传统 Worker Route 时才需要此 Token。</text>
</svg>
