<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040" role="img" aria-labelledby="title desc">
  <title id="title">Cloudflare Zone Token 配置示意图</title>
  <desc id="desc">创建限制到指定 Zone 的 DNS Token；easy_all 使用 DNS 和 Zone 权限，easy_cmcc 额外使用 Zone Settings 和 Config Rules 权限。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity=".12"/></filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#1f2937}.small{font-size:21px}.body{font-size:25px}.label{font-size:24px;font-weight:680}.title{font-size:42px;font-weight:760}.muted{fill:#6b7280}.orange{fill:#f48120}.green{fill:#0f9d72}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    </style>
  </defs>
  <rect width="1400" height="820" fill="#f5f7fb"/>
  <text x="70" y="72" class="title">② 创建 CF_DNS_API_TOKEN</text>
  <text x="70" y="114" class="body muted">My Profile → API Tokens → Create Token → Create Custom Token</text>
  <rect x="70" y="152" width="1260" height="578" rx="24" fill="#fff" filter="url(#shadow)"/>
  <rect x="70" y="152" width="1260" height="64" rx="24" fill="#1f2937"/>
  <text x="110" y="194" class="small" fill="#fff" style="fill:#fff">My Profile  ›  API Tokens  ›  Create Custom Token</text>
  <text x="110" y="270" class="label">Token name</text>
  <rect x="320" y="235" width="520" height="52" rx="10" fill="#fff" stroke="#cfd6df" stroke-width="2"/>
  <text x="344" y="269" class="body mono">dns-zone-token</text>
  <text x="110" y="340" class="label">Permissions</text>
  <rect x="110" y="370" width="1170" height="304" rx="15" fill="#fafbfc" stroke="#dbe1ea" stroke-width="2"/>
  <text x="145" y="413" class="small muted">Resource</text><text x="430" y="413" class="small muted">Permission</text><text x="895" y="413" class="small muted">Level</text><text x="1050" y="413" class="small muted">使用范围</text>
  <line x1="130" y1="430" x2="1260" y2="430" stroke="#dbe1ea"/>
  <text x="145" y="472" class="body">Zone</text><text x="430" y="472" class="body">DNS</text><rect x="880" y="442" width="126" height="45" rx="9" fill="#fff1e7"/><text x="911" y="472" class="body orange">Edit</text><text x="1050" y="472" class="small green">两套都需要</text>
  <text x="145" y="529" class="body">Zone</text><text x="430" y="529" class="body">Zone</text><rect x="880" y="499" width="126" height="45" rx="9" fill="#edf7ff"/><text x="909" y="529" class="body" fill="#1677aa" style="fill:#1677aa">Read</text><text x="1050" y="529" class="small green">两套都需要</text>
  <text x="145" y="586" class="body">Zone</text><text x="430" y="586" class="body">Zone Settings</text><rect x="880" y="556" width="126" height="45" rx="9" fill="#fff1e7"/><text x="911" y="586" class="body orange">Edit</text><text x="1050" y="586" class="small orange">仅 CMCC 自动配置</text>
  <text x="145" y="643" class="body">Zone</text><text x="430" y="643" class="body">Config Rules</text><rect x="880" y="613" width="126" height="45" rx="9" fill="#fff1e7"/><text x="911" y="643" class="body orange">Edit</text><text x="1050" y="643" class="small orange">仅 CMCC 自动配置</text>
  <text x="110" y="739" class="label">Zone Resources</text>
  <rect x="340" y="704" width="235" height="52" rx="10" fill="#fff" stroke="#cfd6df" stroke-width="2"/><text x="370" y="738" class="body">Include</text>
  <rect x="595" y="704" width="500" height="52" rx="10" fill="#fff" stroke="#f48120" stroke-width="3"/><text x="625" y="738" class="body">Specific zone: example.com</text>
  <rect x="110" y="798" width="1170" height="112" rx="14" fill="#fff8f1"/>
  <text x="145" y="835" class="label orange">easy_all 只添加前两行；easy_cmcc 推荐四行全部添加</text>
  <text x="145" y="872" class="small">部分新界面或 API 文档把 Config Rules → Edit 显示为 Config Settings → Write。</text>
  <text x="145" y="900" class="small">创建后 Secret 通常只显示一次；不要截图或提交到 Git。</text>
  <text x="70" y="1010" class="small muted">Zone Resources 请选择节点域名所在的单个 Zone，不要选择所有 Zone。</text>
</svg>
