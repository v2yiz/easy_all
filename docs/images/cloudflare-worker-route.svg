<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Cloudflare Worker Route 配置示意图</title>
  <desc id="desc">将 sub.example.com 的全部路径路由到 easy-all Worker。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f48120"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#1f2937}.small{font-size:21px}.body{font-size:25px}.label{font-size:24px;font-weight:680}.title{font-size:42px;font-weight:760}.muted{fill:#6b7280}.orange{fill:#f48120}.green{fill:#0f9d72}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    </style>
  </defs>
  <rect width="1400" height="900" fill="#f5f7fb"/>
  <text x="70" y="72" class="title">⑤ 把订阅域名路由到 easy-all</text>
  <text x="70" y="114" class="body muted">Workers &amp; Pages → easy-all → Settings → Domains &amp; Routes → Add → Route</text>
  <rect x="70" y="152" width="1260" height="650" rx="24" fill="#fff" filter="url(#shadow)"/>
  <rect x="70" y="152" width="1260" height="64" rx="24" fill="#1f2937"/>
  <text x="110" y="194" class="small" style="fill:#fff">easy-all  ›  Settings  ›  Domains &amp; Routes  ›  Add route</text>

  <text x="110" y="285" class="label">Zone</text>
  <rect x="330" y="245" width="720" height="58" rx="10" fill="#fff" stroke="#cfd6df" stroke-width="2"/>
  <text x="365" y="283" class="body mono">example.com</text>
  <text x="1010" y="283" class="body muted">⌄</text>

  <text x="110" y="390" class="label">Route</text>
  <rect x="330" y="345" width="720" height="64" rx="10" fill="#fff" stroke="#f48120" stroke-width="3"/>
  <text x="365" y="387" class="body mono">sub.example.com/*</text>
  <text x="1080" y="384" class="small green">✓</text>

  <rect x="110" y="455" width="1170" height="88" rx="14" fill="#fff8f1"/>
  <text x="145" y="491" class="label orange">为什么要保留 /* ？</text>
  <text x="145" y="524" class="small">它同时匹配 /subscribe、下载路径和查询参数；Route pattern 中不要填写 ?token=…。</text>

  <rect x="110" y="590" width="340" height="105" rx="18" fill="#eef3ff" stroke="#cfd9ef" stroke-width="2"/>
  <text x="145" y="630" class="small muted">请求</text>
  <text x="145" y="669" class="body mono">sub.example.com</text>
  <line x1="470" y1="642" x2="620" y2="642" stroke="#f48120" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="645" y="590" width="260" height="105" rx="18" fill="#fff8f1" stroke="#f48120" stroke-width="3"/>
  <text x="705" y="630" class="small orange">Worker</text>
  <text x="700" y="669" class="body mono">easy-all</text>
  <line x1="925" y1="642" x2="1070" y2="642" stroke="#f48120" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="1095" y="590" width="185" height="105" rx="18" fill="#eefaf6" stroke="#9ddbc7" stroke-width="2"/>
  <text x="1146" y="630" class="small green">响应</text>
  <text x="1130" y="669" class="body mono">订阅内容</text>

  <rect x="1060" y="725" width="220" height="52" rx="10" fill="#f48120"/>
  <text x="1110" y="759" class="body" style="fill:#fff;font-weight:700">Add route</text>
  <text x="70" y="857" class="small muted">创建 Route 前，sub.example.com 必须已经有 Proxied / 橙云 DNS 记录；添加后用自定义域名替换 workers.dev 即可。</text>
</svg>
