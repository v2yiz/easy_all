<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Cloudflare Worker Token 配置示意图</title>
  <desc id="desc">创建仅用于部署 Cloudflare Worker 脚本的最小权限 Token。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity=".12"/></filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#1f2937}.small{font-size:21px}.body{font-size:25px}.label{font-size:24px;font-weight:680}.title{font-size:42px;font-weight:760}.muted{fill:#6b7280}.orange{fill:#f48120}.green{fill:#0f9d72}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    </style>
  </defs>
  <rect width="1400" height="860" fill="#f5f7fb"/>
  <text x="70" y="72" class="title">③ 创建 CF_WORKER_API_TOKEN</text>
  <text x="70" y="114" class="body muted">My Profile → API Tokens → Create Token → Create Custom Token</text>
  <rect x="70" y="152" width="1260" height="620" rx="24" fill="#fff" filter="url(#shadow)"/>
  <rect x="70" y="152" width="1260" height="64" rx="24" fill="#1f2937"/>
  <text x="110" y="194" class="small" style="fill:#fff">My Profile  ›  API Tokens  ›  Create Custom Token</text>
  <text x="110" y="275" class="label">Token name</text>
  <rect x="320" y="240" width="520" height="52" rx="10" fill="#fff" stroke="#cfd6df" stroke-width="2"/>
  <text x="344" y="274" class="body mono">worker-deploy-token</text>
  <text x="110" y="355" class="label">Permissions</text>
  <rect x="110" y="385" width="1170" height="132" rx="15" fill="#fafbfc" stroke="#dbe1ea" stroke-width="2"/>
  <text x="145" y="428" class="small muted">Resource</text><text x="430" y="428" class="small muted">Permission</text><text x="915" y="428" class="small muted">Level</text>
  <line x1="130" y1="445" x2="1260" y2="445" stroke="#dbe1ea"/>
  <text x="145" y="492" class="body">Account</text><text x="430" y="492" class="body">Workers Scripts</text><rect x="900" y="459" width="126" height="45" rx="9" fill="#fff1e7"/><text x="931" y="489" class="body orange">Edit</text><text x="1065" y="489" class="small green">✓ replace Worker</text>
  <text x="110" y="592" class="label">Account Resources</text>
  <rect x="375" y="556" width="235" height="52" rx="10" fill="#fff" stroke="#cfd6df" stroke-width="2"/><text x="405" y="590" class="body">Include</text>
  <rect x="630" y="556" width="500" height="52" rx="10" fill="#fff" stroke="#f48120" stroke-width="3"/><text x="660" y="590" class="body">Specific account: My Account</text>
  <rect x="110" y="658" width="1170" height="78" rx="14" fill="#fff8f1"/>
  <text x="145" y="691" class="label orange">Secret → CF_WORKER_API_TOKEN</text>
  <text x="145" y="720" class="small">只需 Workers Scripts Edit；无需 DNS、KV、R2 或 Account Settings Edit。</text>
  <text x="70" y="825" class="small muted">easy_all 与 easy_cmcc 共用此最小权限方案；无需使用包含更多权限的 Worker Token 模板。</text>
</svg>
