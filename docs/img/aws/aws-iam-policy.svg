<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Least privilege IAM policy for easy_all</title>
  <desc id="desc">The deployer can manage CloudFront distributions and us-east-1 ACM certificates for the CloudFront chain, including explicit deletion only during uninstall --purge-cloud. It cannot manage Route 53, WAF, CloudFront logging, IAM or Cloudflare resources.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-opacity=".12"/></filter><style>.ttl{font:700 31px system-ui,sans-serif;fill:#172b4d}.sub{font:16px system-ui,sans-serif;fill:#5e6c84}.h{font:700 20px system-ui,sans-serif;fill:#172b4d}.t{font:15px system-ui,sans-serif;fill:#344563}.mono{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#172b4d}.box{filter:url(#s);stroke-width:2}</style></defs>
  <rect width="1200" height="680" fill="#f7f9fc"/>
  <text x="58" y="62" class="ttl">EasyAllCloudFrontPolicy · 最小权限拆分</text>
  <text x="58" y="93" class="sub">创建/读取/更新，加显式删除（仅 uninstall --purge-cloud 生效）</text>

  <rect class="box" x="55" y="155" width="290" height="310" rx="18" fill="#fff" stroke="#ff9900"/>
  <rect x="55" y="155" width="290" height="62" rx="18" fill="#fff0d5"/><text x="200" y="194" class="h" text-anchor="middle">CloudFront 分发</text>
  <text x="80" y="252" class="t">✓ ListDistributions</text><text x="80" y="283" class="t">✓ GetDistribution / Config</text><text x="80" y="314" class="t">✓ CreateDistribution</text><text x="80" y="345" class="t">✓ UpdateDistribution（带 ETag）</text>
  <text x="80" y="376" class="t">✓ DeleteDistribution</text>
  <rect x="78" y="392" width="244" height="55" rx="10" fill="#f4f5f7"/><text x="200" y="415" class="mono" text-anchor="middle">Comment 精确标记</text><text x="200" y="436" class="sub" text-anchor="middle">easy_all-cloudfront-&lt;节点域名&gt;</text>

  <rect class="box" x="375" y="155" width="270" height="310" rx="18" fill="#fff" stroke="#6554c0"/>
  <rect x="375" y="155" width="270" height="62" rx="18" fill="#eae6ff"/><text x="510" y="194" class="h" text-anchor="middle">ACM 证书</text>
  <text x="400" y="252" class="t">✓ RequestCertificate</text><text x="400" y="283" class="t">✓ DescribeCertificate</text><text x="400" y="314" class="t">✓ Add/ListTagsForCertificate</text><text x="400" y="345" class="t">✓ DeleteCertificate</text>
  <text x="510" y="385" class="sub" text-anchor="middle">固定区域</text><text x="510" y="409" class="mono" text-anchor="middle">us-east-1</text>
  <text x="510" y="436" class="sub" text-anchor="middle">InUseBy 非空不删</text>

  <rect class="box" x="675" y="155" width="260" height="310" rx="18" fill="#fff" stroke="#4c9aff"/>
  <rect x="675" y="155" width="260" height="62" rx="18" fill="#deebff"/><text x="805" y="194" class="h" text-anchor="middle">使用方式</text>
  <text x="700" y="252" class="t">✓ 无状态发现先完整分页</text><text x="700" y="283" class="t">✓ 唯一精确 marker 才接管</text><text x="700" y="314" class="t">✓ 删除前先 Enabled=false</text>
  <rect x="698" y="378" width="214" height="70" rx="10" fill="#f4f5f7"/><text x="805" y="403" class="mono" text-anchor="middle">删除需人工触发</text><text x="805" y="428" class="sub" text-anchor="middle">多候选 / 查询失败即退出</text>

  <rect class="box" x="965" y="155" width="175" height="310" rx="18" fill="#ffebe6" stroke="#de350b"/>
  <rect x="965" y="155" width="175" height="62" rx="18" fill="#ffbdad"/><text x="1052" y="194" class="h" text-anchor="middle">明确没有</text>
  <text x="990" y="260" class="t">✕ Route 53</text><text x="990" y="299" class="t">✕ WAF / 日志</text><text x="990" y="338" class="t">✕ IAM 管理权限</text><text x="990" y="377" class="t">✕ Cloudflare 权限</text>

  <rect x="150" y="530" width="900" height="92" rx="16" fill="#fff" stroke="#dfe1e6" stroke-width="2"/>
  <text x="600" y="568" class="h" text-anchor="middle">AWS 密钥只在内存</text>
  <text x="600" y="597" class="sub" text-anchor="middle">Access Key ID / Secret 仅当前进程使用，不写入 state.env、~/.aws、订阅产物或日志</text>
</svg>
