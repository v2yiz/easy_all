<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">将指定节点订阅绑定到 Shadowrocket 的 AUTO 代理分组</title>
  <desc id="desc">从配置详情进入代理分组，编辑 AUTO，开启订阅，选择服务器节点订阅，保持正则为空并保存。</desc>
  <defs><filter id="s" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#18324d" flood-opacity=".14"/></filter><style>.f{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.t{font-size:34px;font-weight:750}.h{font-size:23px;font-weight:700}.b{font-size:18px}.sm{font-size:15px}.ink{fill:#172238}.muted{fill:#68758a}.blue{fill:#147ee7}.orange{fill:#ff9f0a}.green{fill:#19a96a}</style></defs>
  <rect width="1400" height="800" fill="#f3f6fa"/><text x="700" y="52" text-anchor="middle" class="f t ink">第 3 步：开启订阅并把它绑定到 AUTO</text>
  <g transform="translate(35 90)" filter="url(#s)"><rect width="385" height="620" rx="20" fill="#fff"/><rect width="128" height="620" rx="20" fill="#f1f6fb"/><text x="20" y="92" class="f b ink">⌂ 首页</text><rect x="9" y="108" width="110" height="46" rx="11" fill="#0b85f2"/><text x="20" y="139" class="f h" fill="#fff">▱ 配置</text><text x="20" y="185" class="f b ink">＋ 数据</text><text x="20" y="228" class="f b ink">⚙ 设置</text><rect x="128" width="257" height="57" rx="20" fill="#2b7fc4"/><text x="256" y="37" text-anchor="middle" class="f h" fill="#fff">EASY_ALL.conf</text><rect x="145" y="83" width="223" height="65" rx="13" fill="#f8fafc" stroke="#d7dfeb"/><text x="160" y="121" class="f h ink">代理分组</text><text x="336" y="121" class="f h muted">1 ›</text><circle cx="337" cy="116" r="25" fill="none" stroke="#ff9f0a" stroke-width="5"/><circle cx="337" cy="171" r="17" fill="#ff9f0a"/><text x="337" y="178" text-anchor="middle" class="f h" fill="#fff">1</text><text x="256" y="575" text-anchor="middle" class="f sm muted">配置详情 → 代理分组</text></g>
  <path d="M435 390h38" stroke="#9aa9ba" stroke-width="4"/><path d="m466 380 12 10-12 10" fill="none" stroke="#9aa9ba" stroke-width="4"/>
  <g transform="translate(490 90)" filter="url(#s)"><rect width="385" height="620" rx="20" fill="#fff"/><rect width="385" height="57" rx="20" fill="#2b7fc4"/><text x="193" y="37" text-anchor="middle" class="f h" fill="#fff">代理分组</text><text x="20" y="37" class="f h" fill="#fff">‹</text><rect x="16" y="83" width="353" height="82" rx="14" fill="#f0f2f5"/><text x="35" y="117" class="f h ink">AUTO</text><text x="35" y="143" class="f sm muted">URL-TEST  ›  当前节点</text><text x="331" y="132" class="f h blue">ⓘ</text><circle cx="338" cy="126" r="25" fill="none" stroke="#ff9f0a" stroke-width="5"/><circle cx="338" cy="183" r="17" fill="#ff9f0a"/><text x="338" y="190" text-anchor="middle" class="f h" fill="#fff">2</text><text x="192" y="565" text-anchor="middle" class="f sm muted">点 AUTO 最右侧 ⓘ</text></g>
  <path d="M890 390h38" stroke="#9aa9ba" stroke-width="4"/><path d="m921 380 12 10-12 10" fill="none" stroke="#9aa9ba" stroke-width="4"/>
  <g transform="translate(945 55)" filter="url(#s)"><rect width="415" height="690" rx="24" fill="#f5f5f5"/><rect width="415" height="65" rx="24" fill="#4c4c4c"/><text x="207" y="42" text-anchor="middle" class="f h" fill="#fff">代理分组</text><text x="22" y="43" class="f t" fill="#d7d7d7">×</text><text x="365" y="42" class="f h" fill="#fff">保存</text><text x="27" y="104" class="f b muted">名称</text><rect x="18" y="118" width="379" height="52" rx="24" fill="#fff"/><text x="37" y="151" class="f b ink">AUTO</text><text x="27" y="210" class="f b muted">类型</text><rect x="18" y="224" width="379" height="52" rx="24" fill="#fff"/><text x="37" y="257" class="f b ink">url-test</text><text x="365" y="257" class="f h muted">›</text><text x="27" y="317" class="f b muted">订阅</text><rect x="18" y="332" width="379" height="112" rx="20" fill="#fff"/><text x="38" y="371" class="f h ink">订阅</text><rect x="324" y="348" width="55" height="30" rx="16" fill="#147ee7"/><circle cx="363" cy="363" r="12" fill="#fff"/><text x="38" y="422" class="f h ink">服务器节点</text><text x="297" y="422" class="f b muted">我的订阅</text><text x="370" y="422" class="f h muted">›</text><circle cx="363" cy="363" r="27" fill="none" stroke="#ff9f0a" stroke-width="5"/><circle cx="363" cy="445" r="17" fill="#ff9f0a"/><text x="363" y="452" text-anchor="middle" class="f h" fill="#fff">3</text><text x="27" y="491" class="f b muted">正则</text><rect x="18" y="505" width="379" height="52" rx="24" fill="#fff"/><text x="37" y="538" class="f b muted">留空（使用所选订阅的全部节点）</text><circle cx="208" cy="531" r="25" fill="none" stroke="#ff9f0a" stroke-width="4"/><rect x="18" y="586" width="379" height="70" rx="16" fill="#eaf8f2" stroke="#83c9ab"/><text x="207" y="615" text-anchor="middle" class="f b green">在“服务器节点”勾选自己的订阅</text><text x="207" y="641" text-anchor="middle" class="f sm muted">完成 → 返回此页 → 保存</text><circle cx="365" cy="38" r="29" fill="none" stroke="#ff9f0a" stroke-width="5"/><circle cx="365" cy="82" r="17" fill="#ff9f0a"/><text x="365" y="89" text-anchor="middle" class="f h" fill="#fff">4</text></g>
  <text x="700" y="775" text-anchor="middle" class="f b muted">订阅限定“哪些节点加入 AUTO”；正则留空即可测速该订阅内的全部节点。</text>
</svg>
