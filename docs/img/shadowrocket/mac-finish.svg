<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">macOS Shadowrocket 启用配置模式并验证 AUTO</title>
  <desc id="desc">在首页打开连接，确认全局路由为配置，并从代理分组中查看 AUTO 当前优选节点。</desc>
  <defs><filter id="s" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#18324d" flood-opacity=".13"/></filter><style>.f{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.t{font-size:35px;font-weight:750}.h{font-size:23px;font-weight:700}.b{font-size:18px}.sm{font-size:15px}.ink{fill:#172238}.muted{fill:#68758a}.blue{fill:#287bc1}.orange{fill:#ff9f0a}.green{fill:#26a269}</style></defs>
  <rect width="1400" height="760" fill="#f3f6fa"/><text x="700" y="54" text-anchor="middle" class="f t ink">第 5 步：启用“配置”路由并验证 AUTO</text>
  <g transform="translate(42 95)" filter="url(#s)"><rect width="690" height="580" rx="20" fill="#fff"/><rect width="205" height="580" rx="20" fill="#f1f2f4"/><rect x="12" y="67" width="181" height="48" rx="12" fill="#dfe3e8"/><text x="33" y="99" class="f h blue">⌂ 首页</text><text x="33" y="150" class="f b ink">▱ 配置</text><text x="33" y="195" class="f b ink">＋ 数据</text><text x="33" y="240" class="f b ink">⚙ 设置</text>
    <rect x="205" width="485" height="58" rx="20" fill="#287bc1"/><text x="448" y="38" text-anchor="middle" class="f h" fill="#fff">首页</text><text x="654" y="39" class="f t" fill="#fff">＋</text>
    <rect x="225" y="80" width="445" height="75" rx="15" fill="#f8fafc" stroke="#d7dfeb"/><text x="248" y="111" class="f sm muted">当前节点</text><text x="248" y="139" class="f h ink">NODE_06</text><rect x="590" y="99" width="60" height="33" rx="17" fill="#26a269"/><circle cx="633" cy="115.5" r="14" fill="#fff"/><circle cx="622" cy="115" r="31" fill="none" stroke="#ff9f0a" stroke-width="5"/><circle cx="622" cy="164" r="17" fill="#ff9f0a"/><text x="622" y="171" text-anchor="middle" class="f h" fill="#fff">1</text>
    <rect x="225" y="181" width="445" height="66" rx="14" fill="#eef5ff" stroke="#79ace0"/><text x="248" y="221" class="f h ink">全局路由</text><text x="602" y="221" class="f h blue">配置 ›</text><circle cx="624" cy="215" r="31" fill="none" stroke="#ff9f0a" stroke-width="5"/><circle cx="624" cy="264" r="17" fill="#ff9f0a"/><text x="624" y="271" text-anchor="middle" class="f h" fill="#fff">2</text>
    <rect x="225" y="276" width="445" height="73" rx="14" fill="#f8fafc"/><text x="248" y="309" class="f b ink">连通性测试</text><text x="248" y="333" class="f sm muted">CONNECT</text>
    <rect x="225" y="430" width="445" height="88" rx="15" fill="#f2f4f7"/><text x="278" y="464" text-anchor="middle" class="f h blue">⌘</text><text x="278" y="493" text-anchor="middle" class="f sm ink">代理分组</text><text x="393" y="464" text-anchor="middle" class="f h blue">▣</text><text x="393" y="493" text-anchor="middle" class="f sm ink">粘贴</text><text x="508" y="464" text-anchor="middle" class="f h blue">↻</text><text x="508" y="493" text-anchor="middle" class="f sm ink">更新</text><text x="623" y="464" text-anchor="middle" class="f h blue">↕</text><text x="623" y="493" text-anchor="middle" class="f sm ink">排序</text><circle cx="278" cy="467" r="37" fill="none" stroke="#ff9f0a" stroke-width="5"/><circle cx="278" cy="532" r="17" fill="#ff9f0a"/><text x="278" y="539" text-anchor="middle" class="f h" fill="#fff">3</text>
  </g>
  <g transform="translate(785 117)" filter="url(#s)"><rect width="565" height="255" rx="20" fill="#fff"/><rect width="565" height="56" rx="20" fill="#287bc1"/><text x="282" y="36" text-anchor="middle" class="f h" fill="#fff">全局路由</text><g class="f b ink"><text x="32" y="100">配置</text><text x="32" y="143">代理</text><text x="32" y="186">直连</text><text x="32" y="229">场景</text></g><text x="520" y="102" class="f h blue">✓</text><rect x="19" y="69" width="527" height="48" rx="11" fill="none" stroke="#79ace0" stroke-width="2"/><text x="301" y="102" class="f sm muted">按规则配置分流</text></g>
  <g transform="translate(785 405)" filter="url(#s)"><rect width="565" height="230" rx="20" fill="#fff"/><rect width="565" height="56" rx="20" fill="#287bc1"/><text x="282" y="36" text-anchor="middle" class="f h" fill="#fff">代理分组</text><rect x="20" y="78" width="525" height="82" rx="14" fill="#eaf8f2" stroke="#74c6a7"/><text x="42" y="112" class="f h ink">AUTO</text><text x="42" y="140" class="f sm muted">URL-TEST  &gt;  NODE_06</text><text x="509" y="127" class="f h green">✓</text><text x="282" y="198" text-anchor="middle" class="f sm muted">副标题中的节点会由 url-test 自动更新</text></g>
  <text x="700" y="718" text-anchor="middle" class="f b muted">最终状态：连接已开启 · 全局路由 = 配置 · AUTO 显示当前优选节点</text>
