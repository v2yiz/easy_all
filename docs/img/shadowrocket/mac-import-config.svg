<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">macOS Shadowrocket 下载并选中 EASY_ALL.conf</title><desc id="desc">在配置页点右上角加号，从给定 URL 下载配置，随后在本地文件中确认 EASY_ALL.conf 右侧出现勾选。</desc>
  <defs><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#18324d" flood-opacity=".13"/></filter><style>.f{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.t{font-size:36px;font-weight:750}.h{font-size:24px;font-weight:700}.b{font-size:19px}.sm{font-size:16px}.ink{fill:#172238}.muted{fill:#68758a}.blue{fill:#287bc1}.orange{fill:#ff9f0a}</style></defs>
  <rect width="1400" height="760" fill="#f3f6fa"/><text x="700" y="55" text-anchor="middle" class="f t ink">第 2 步：下载并选中 EASY_ALL.conf</text>
  <g transform="translate(45 90)" filter="url(#s)"><rect width="620" height="610" rx="20" fill="#fff"/><rect width="205" height="610" rx="20" fill="#f2f3f5"/><text x="34" y="96" class="f b ink">⌂ 首页</text><rect x="12" y="110" width="181" height="48" rx="12" fill="#e2e5e9"/><text x="34" y="142" class="f h blue">▱ 配置</text><text x="34" y="190" class="f b ink">＋ 数据</text><text x="34" y="235" class="f b ink">⚙ 设置</text><rect x="205" width="415" height="58" rx="20" fill="#287bc1"/><text x="413" y="38" text-anchor="middle" class="f h" fill="#fff">配置</text><text x="580" y="40" text-anchor="middle" class="f t" fill="#fff">＋</text><circle cx="580" cy="29" r="26" fill="none" stroke="#ff9f0a" stroke-width="5"/><circle cx="580" cy="29" r="15" fill="#ff9f0a"/><text x="580" y="36" text-anchor="middle" class="f h" fill="#fff">1</text>
  <rect x="226" y="79" width="373" height="185" rx="16" fill="#f7f8fa"/><text x="250" y="113" class="f b ink">↶ 恢复默认配置</text><text x="250" y="157" class="f b ink">☁ 导入…</text><text x="250" y="201" class="f b ink">⌁ Wi-Fi 上传</text><text x="250" y="245" class="f b ink">⚗ 测试规则</text><text x="226" y="308" class="f sm muted">本地文件</text><rect x="226" y="323" width="373" height="66" rx="14" fill="#fff" stroke="#d9e1ec"/><circle cx="242" cy="345" r="6" fill="#ff9f0a"/><text x="258" y="348" class="f b ink">EASY_ALL.conf</text><text x="258" y="372" class="f sm muted">规则配置</text><text x="550" y="359" class="f h blue">✓  ⓘ</text><circle cx="538" cy="405" r="18" fill="#ff9f0a"/><text x="538" y="412" text-anchor="middle" class="f h" fill="#fff">3</text></g>
  <g transform="translate(760 180)" filter="url(#s)"><rect width="545" height="354" rx="22" fill="#fff" stroke="#d6dde8"/><text x="272" y="54" text-anchor="middle" class="f h ink">从给定的 URL 下载配置…</text><rect x="46" y="88" width="453" height="54" rx="22" fill="#eef5ff" stroke="#7db3ee"/><text x="70" y="122" class="f b muted">https://维护者提供的/EASY_ALL.conf</text><rect x="46" y="165" width="453" height="54" rx="12" fill="#287bc1"/><text x="272" y="200" text-anchor="middle" class="f h" fill="#fff">下载</text><rect x="46" y="236" width="453" height="54" rx="22" fill="#e8e9eb"/><text x="272" y="270" text-anchor="middle" class="f b ink">取消</text><circle cx="500" cy="24" r="18" fill="#ff9f0a"/><text x="500" y="31" text-anchor="middle" class="f h" fill="#fff">2</text></g>
  <text x="700" y="735" text-anchor="middle" class="f sm muted">右侧 ✓ 表示正在使用；橙色圆点表示默认配置，两者含义不同。</text>
</svg>

