<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">macOS Shadowrocket 添加节点订阅</title>
  <desc id="desc">左侧是 Shadowrocket 首页，右上角加号进入添加节点；右侧添加节点页选择 Subscribe，填写 URL 后保存。</desc>
  <defs><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#18324d" flood-opacity=".13"/></filter><style>.f{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.t{font-size:36px;font-weight:750}.h{font-size:24px;font-weight:700}.b{font-size:19px}.sm{font-size:16px}.ink{fill:#172238}.muted{fill:#68758a}.blue{fill:#287bc1}.green{fill:#15966a}</style></defs>
  <rect width="1400" height="760" fill="#f3f6fa"/><text x="700" y="55" text-anchor="middle" class="f t ink">第 1 步：在首页添加节点订阅</text>
  <g transform="translate(45 90)" filter="url(#s)"><rect width="620" height="610" rx="20" fill="#fff"/><rect width="205" height="610" rx="20" fill="#f2f3f5"/><rect x="12" y="65" width="181" height="48" rx="12" fill="#e2e5e9"/><text x="34" y="96" class="f h blue">⌂ 首页</text><text x="34" y="145" class="f b ink">▱ 配置</text><text x="34" y="190" class="f b ink">＋ 数据</text><text x="34" y="235" class="f b ink">⚙ 设置</text><rect x="205" width="415" height="58" rx="20" fill="#287bc1"/><text x="413" y="38" text-anchor="middle" class="f h" fill="#fff">Shadowrocket</text><circle cx="580" cy="29" r="22" fill="#fff" opacity=".14"/><text x="580" y="38" text-anchor="middle" class="f t" fill="#fff">＋</text><circle cx="580" cy="29" r="31" fill="none" stroke="#ff9f0a" stroke-width="5"/>
  <rect x="226" y="78" width="373" height="111" rx="15" fill="#f7f8fa"/><text x="250" y="112" class="f b ink">🚀 示例节点</text><text x="250" y="152" class="f b ink">⚙ 全局路由</text><text x="560" y="152" text-anchor="end" class="f b blue">配置 ›</text><text x="250" y="207" class="f sm muted">订阅</text><rect x="226" y="224" width="373" height="66" rx="14" fill="#fff" stroke="#d9e1ec"/><text x="250" y="252" class="f b ink">my-subscription</text><text x="250" y="275" class="f sm muted">展开后显示节点</text><text x="567" y="263" text-anchor="end" class="f h blue">↻</text><circle cx="580" cy="29" r="15" fill="#ff9f0a"/><text x="580" y="36" text-anchor="middle" class="f h" fill="#fff">1</text></g>
  <path d="M680 380H735" stroke="#7e8da3" stroke-width="4"/><path d="M728 369l18 11-18 11" fill="#7e8da3"/>
  <g transform="translate(755 90)" filter="url(#s)"><rect width="600" height="610" rx="20" fill="#fff"/><rect width="600" height="58" rx="20" fill="#287bc1"/><text x="32" y="38" class="f h" fill="#fff">‹</text><text x="300" y="38" text-anchor="middle" class="f h" fill="#fff">添加节点</text><text x="548" y="38" class="f b" fill="#fff">保存</text><circle cx="565" cy="29" r="18" fill="#ff9f0a"/><text x="565" y="36" text-anchor="middle" class="f h" fill="#fff">4</text>
  <text x="30" y="105" class="f sm muted">类型</text><rect x="22" y="120" width="556" height="53" rx="14" fill="#f3f4f6"/><text x="44" y="153" class="f b ink">Subscribe</text><text x="550" y="153" text-anchor="end" class="f b muted">›</text><circle cx="545" cy="91" r="18" fill="#ff9f0a"/><text x="545" y="98" text-anchor="middle" class="f h" fill="#fff">2</text>
  <text x="30" y="218" class="f sm muted">URL</text><rect x="22" y="233" width="556" height="53" rx="14" fill="#eef5ff" stroke="#7db3ee"/><text x="44" y="266" class="f b muted">https://你的节点订阅地址</text><circle cx="545" cy="207" r="18" fill="#ff9f0a"/><text x="545" y="214" text-anchor="middle" class="f h" fill="#fff">3</text>
  <text x="30" y="332" class="f sm muted">备注</text><rect x="22" y="347" width="556" height="53" rx="14" fill="#f3f4f6"/><text x="44" y="380" class="f b muted">可选</text><rect x="22" y="458" width="556" height="84" rx="14" fill="#eef8f3" stroke="#b4dfcd"/><text x="300" y="493" text-anchor="middle" class="f h green">保存后返回首页更新订阅</text><text x="300" y="521" text-anchor="middle" class="f sm muted">确认订阅下出现真实节点</text></g>
  <text x="700" y="735" text-anchor="middle" class="f sm muted">脱敏重绘：按 macOS Shadowrocket 实际界面核对，订阅地址与节点名均为示例。</text>
</svg>

