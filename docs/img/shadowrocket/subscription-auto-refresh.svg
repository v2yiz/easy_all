<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">iPhone 和 iPad 版 Shadowrocket 每小时自动更新订阅</title>
  <desc id="desc">在 Shadowrocket 设置的订阅页面打开打开时更新和自动后台更新，将间隔设置为一小时，并在系统设置开启后台 App 刷新。</desc>
  <defs><filter id="s" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#18324d" flood-opacity=".14"/></filter><style>.f{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.t{font-size:35px;font-weight:750}.h{font-size:23px;font-weight:700}.b{font-size:18px}.sm{font-size:15px}.ink{fill:#172238}.muted{fill:#68758a}.blue{fill:#147ee7}.orange{fill:#ff9f0a}.green{fill:#19a96a}</style></defs>
  <rect width="1400" height="720" fill="#f3f6fa"/><text x="700" y="55" text-anchor="middle" class="f t ink">第 5 步：iPhone / iPad 每小时自动更新节点订阅</text>
  <g transform="translate(72 108)" filter="url(#s)"><rect width="530" height="480" rx="25" fill="#f5f5f5"/><rect width="530" height="64" rx="25" fill="#2b7fc4"/><text x="265" y="41" text-anchor="middle" class="f h" fill="#fff">设置</text><text x="26" y="42" class="f h" fill="#fff">‹</text><text x="30" y="111" class="f b muted">更新</text><rect x="18" y="126" width="494" height="60" rx="15" fill="#fff"/><text x="40" y="164" class="f h ink">订阅</text><text x="475" y="164" class="f h muted">›</text><circle cx="476" cy="156" r="27" fill="none" stroke="#ff9f0a" stroke-width="5"/><circle cx="476" cy="210" r="17" fill="#ff9f0a"/><text x="476" y="217" text-anchor="middle" class="f h" fill="#fff">1</text><text x="265" y="390" text-anchor="middle" class="f b muted">Shadowrocket → 设置 → 订阅</text></g>
  <path d="M620 348h52" stroke="#9aa9ba" stroke-width="4"/><path d="m661 338 12 10-12 10" fill="none" stroke="#9aa9ba" stroke-width="4"/>
  <g transform="translate(690 108)" filter="url(#s)"><rect width="638" height="480" rx="25" fill="#f5f5f5"/><rect width="638" height="64" rx="25" fill="#2b7fc4"/><text x="319" y="41" text-anchor="middle" class="f h" fill="#fff">订阅</text><text x="26" y="42" class="f h" fill="#fff">‹</text><rect x="20" y="91" width="598" height="184" rx="20" fill="#fff"/><text x="43" y="132" class="f h ink">打开时更新</text><rect x="530" y="108" width="62" height="32" rx="17" fill="#147ee7"/><circle cx="568" cy="124" r="13" fill="#fff"/><text x="43" y="193" class="f h ink">自动后台更新</text><rect x="530" y="169" width="62" height="32" rx="17" fill="#147ee7"/><circle cx="568" cy="185" r="13" fill="#fff"/><text x="43" y="247" class="f h ink">间隔</text><text x="550" y="247" class="f h blue">1 小时 ›</text><circle cx="558" cy="185" r="29" fill="none" stroke="#ff9f0a" stroke-width="5"/><circle cx="558" cy="274" r="17" fill="#ff9f0a"/><text x="558" y="281" text-anchor="middle" class="f h" fill="#fff">2</text><rect x="20" y="308" width="598" height="112" rx="18" fill="#eaf8f2" stroke="#83c9ab"/><text x="319" y="345" text-anchor="middle" class="f h green">系统设置 → 通用 → 后台 App 刷新</text><text x="319" y="376" text-anchor="middle" class="f b ink">允许 Shadowrocket 使用后台 App 刷新</text><text x="319" y="403" text-anchor="middle" class="f sm muted">系统调度可能延后，无法保证精确到每 60 分钟。</text></g>
  <text x="700" y="655" text-anchor="middle" class="f b muted">macOS 当前版本没有“设置 → 订阅”页面；Mac 可在首页订阅行手动更新。</text>
</svg>
